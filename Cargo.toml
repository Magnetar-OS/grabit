[package]
name = "grabit"
version = "1.0.2"
edition = "2024"
description = "Selection-triggered actions for Wayland desktops"
repository = "https://github.com/Magnetar-OS/grabit"
homepage = "https://github.com/Magnetar-OS/grabit"
license = "GPL-3.0-only"
readme = "README.md"
keywords = ["wayland", "selection", "clipboard", "cosmic", "layer-shell"]
categories = ["gui", "os::linux-apis"]
# libcosmic is only distributed from git, and crates.io refuses a dependency
# without a version requirement. grabit ships as a distro package, not a crate.
publish = false

[dependencies]
libcosmic = { git = "https://github.com/pop-os/libcosmic.git", features = [
    # Size layer surfaces to their contents.
    "autosize",
    # Support more than one surface, which the dummy/hunter/bar split needs.
    "multi-window",
    "tokio",
    "wayland",
    "winit",
] }
tokio = { version = "1", features = ["time", "rt"] }
futures = "0.3"
anyhow = "1.0.104"
async-channel = "2.5.0"
clap = { version = "4.6.6", features = ["derive"] }
dirs = "6.0.0"
env_logger = "0.11.11"
htmd = "0.5.5"
log = "0.4.33"
memfd = "0.6.5"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
shell-words = "1.1.1"
toml = "1.1.4"
toml_edit = "0.23.10"
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }
wayland-protocols-misc = { version = "0.3.12", features = ["client"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
wl-clipboard-rs = "0.9.3"
zbus = { version = "5.19.0", default-features = false, features = ["blocking-api", "async-io"] }
i18n-embed = { version = "0.16.0", features = ["fluent-system", "desktop-requester"] }
i18n-embed-fl = "0.10.1"
rust-embed = "8.12.0"

[profile.release]
# libcosmic pulls in iced and wgpu, so an unstripped binary is close to 40 MB.
lto = "thin"
strip = true

[build-dependencies]
xdgen = "0.1.0"
